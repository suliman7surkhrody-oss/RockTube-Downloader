name: Build Samsung TV Test Version

on:
  push:
    branches:
      - fix/samsung-tv-compatible-downloads
    paths:
      - "main.py"
      - "rocktube.ico"
      - "rocktube_logo.png"
      - ".github/workflows/samsung-tv-test-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-test:
    runs-on: windows-latest
    steps:
      - name: Check out test branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install application and build dependencies
        run: python -m pip install --upgrade pip customtkinter yt-dlp pillow pyinstaller

      - name: Download FFmpeg tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "$env:RUNNER_TEMP\ffmpeg.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\ffmpeg.zip" -DestinationPath "$env:RUNNER_TEMP\ffmpeg-unpack" -Force
          $ffmpeg = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg-unpack" -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          $ffprobe = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg-unpack" -Filter ffprobe.exe -Recurse | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw "FFmpeg or FFprobe executable was not found." }
          New-Item -ItemType Directory -Force -Path "ffmpeg" | Out-Null
          Copy-Item $ffmpeg.FullName "ffmpeg\ffmpeg.exe"
          Copy-Item $ffprobe.FullName "ffmpeg\ffprobe.exe"
          # Bundle DLL dependencies shipped beside the FFmpeg executable.
          Get-ChildItem $ffmpeg.Directory.FullName -Filter "*.dll" | Copy-Item -Destination "ffmpeg" -Force
          & "ffmpeg\ffmpeg.exe" -hide_banner -encoders | Select-String "libx264"
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg encoder verification failed." }
          & "ffmpeg\ffmpeg.exe" -hide_banner -encoders | Select-String "aac"
          & "ffmpeg\ffmpeg.exe" -hide_banner -version
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg failed to launch with its bundled dependencies." }

      - name: Validate Python syntax
        run: python -m py_compile main.py

      - name: Smoke-test TV-compatible encoding
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $output = "$env:RUNNER_TEMP\rocktube-tv-smoke.mp4"
          & "ffmpeg\ffmpeg.exe" -hide_banner -loglevel error -y -f lavfi -i "testsrc2=size=1920x1080:rate=30" -f lavfi -i "sine=frequency=1000:sample_rate=48000" -t 2 -map 0:v:0 -map 1:a:0 -vf "scale=1920:1080:force_original_aspect_ratio=decrease:force_divisible_by=2,fps=25" -c:v libx264 -profile:v high -level:v 4.0 -preset veryfast -crf 22 -pix_fmt yuv420p -c:a aac -profile:a aac_low -b:a 128k -ac 2 -ar 44100 -movflags +faststart $output
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $output)) { throw "FFmpeg Samsung TV encoding smoke test failed." }
          $probe = & "ffmpeg\ffprobe.exe" -v error -show_streams -of json $output | ConvertFrom-Json
          $video = $probe.streams | Where-Object { $_.codec_type -eq "video" } | Select-Object -First 1
          $audio = $probe.streams | Where-Object { $_.codec_type -eq "audio" } | Select-Object -First 1
          if ($video.codec_name -ne "h264" -or $video.width -gt 1920 -or $video.height -gt 1080 -or $video.pix_fmt -ne "yuv420p" -or $video.r_frame_rate -ne "25/1") { throw "Video output does not match the target TV profile." }
          if ($audio.codec_name -ne "aac" -or $audio.sample_rate -ne "44100" -or $audio.channels -ne 2) { throw "Audio output does not match the target TV profile." }
          Write-Host "Verified H.264/yuv420p/25fps video and AAC stereo 44.1kHz audio."

      - name: Build portable application folder
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name "RockTube Downloader" --icon "rocktube.ico" --add-data "rocktube_logo.png;." --add-data "ffmpeg;ffmpeg" main.py
          if (-not (Test-Path "dist\RockTube Downloader\RockTube Downloader.exe")) { throw "Portable application executable was not created." }
          Compress-Archive -Path "dist\RockTube Downloader" -DestinationPath "RockTube-Samsung-TV-Test.zip" -Force

      - name: Upload separate test build
        uses: actions/upload-artifact@v4
        with:
          name: RockTube-Samsung-TV-Test
          path: RockTube-Samsung-TV-Test.zip
          if-no-files-found: error
          retention-days: 14
