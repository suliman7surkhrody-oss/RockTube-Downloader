name: Build Samsung TV Test Version

on:
  push:
    branches:
      - fix/samsung-tv-compatible-downloads
    paths:
      - "main.py"
      - "rocktube.ico"
      - "rocktube_logo.png"
      - ".github/workflows/samsung-tv-test-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-test:
    runs-on: windows-latest
    steps:
      - name: Check out test branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install application and build dependencies
        run: python -m pip install --upgrade pip customtkinter yt-dlp pillow pyinstaller

      - name: Validate Python syntax
        run: python -m py_compile main.py

      - name: Verify minimal direct-download TV compatibility patch
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $source = Get-Content "main.py" -Raw
          if ($source -notmatch 'best\[ext=mp4\]\[vcodec\^=avc1\]\[acodec\^=mp4a\]') {
            throw "The downloader does not select a pre-muxed H.264/AAC MP4."
          }
          if ($source -match 'bestvideo\[height|bestaudio') {
            throw "The selected download format may require merging separate streams."
          }
          Write-Host "Verified: single-file H.264/AAC MP4 selection; original app UI retained."

      - name: Build portable application folder
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name "RockTube Downloader" --icon "rocktube.ico" --add-data "rocktube_logo.png;." main.py
          if (-not (Test-Path "dist\RockTube Downloader\RockTube Downloader.exe")) { throw "Portable application executable was not created." }
          Compress-Archive -Path "dist\RockTube Downloader" -DestinationPath "RockTube-Samsung-TV-Test.zip" -Force

      - name: Upload separate test build
        uses: actions/upload-artifact@v4
        with:
          name: RockTube-Samsung-TV-Test
          path: RockTube-Samsung-TV-Test.zip
          if-no-files-found: error
          retention-days: 14
